<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KastoBrain</title>
<style>
  :root { --bg:#191919; --side:#141414; --line:#2a2a2a; --text:#e6e6e6; --dim:#8a8a8a; --accent:#d9777a; --card:#1f1f1f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Segoe UI", sans-serif; display:flex; min-height:100vh; }
  aside { min-height:100vh; width:230px; background:var(--side); border-right:1px solid var(--line); padding:16px 10px; flex-shrink:0; }
  aside h4 { color:var(--dim); font-size:12px; font-weight:500; margin:18px 8px 6px; }
  .nav { display:block; padding:6px 8px; border-radius:6px; color:var(--text); cursor:pointer; text-decoration:none; }
  .nav:hover, .nav.on { background:#232323; }
  .muted { color:var(--dim); }
  main { flex:1; padding:22px 32px; min-width:0; }
  .crumb { color:var(--dim); font-size:13px; }
  .title { display:flex; align-items:center; gap:12px; margin:18px 0; font-size:18px; }
  .dot { width:36px; height:36px; border-radius:50%; background:#3a2324; display:grid; place-items:center; color:var(--accent); font-weight:700; }
  .tabs { display:flex; gap:20px; border-bottom:1px solid var(--line); }
  .tab { padding:8px 0; cursor:pointer; color:var(--dim); border-bottom:2px solid transparent; }
  .tab.on { color:var(--text); border-color:var(--text); }
  .body { display:flex; gap:28px; padding-top:18px; }
  .sub { width:200px; flex-shrink:0; }
  .panel { flex:1; max-width:720px; }
  .panel h3 { margin:0 0 4px; font-size:15px; }
  .panel p.hint { color:var(--dim); font-size:12px; margin:0 0 10px; }
  textarea, input[type=text], select { width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  textarea { min-height:90px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:16px; }
  button { background:#2a2a2a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:disabled { opacity:.5; cursor:default; }
  .section { margin-bottom:26px; }
  .placeholder { color:var(--dim); border:1px dashed var(--line); border-radius:8px; padding:24px; }
  .cards { display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 22px; }
  .card { width:150px; min-height:150px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; cursor:pointer; overflow:hidden; }
  .card b { display:block; font-size:13px; } .card small { color:var(--dim); font-size:11px; }
  .card p { color:var(--dim); font-size:11px; margin:6px 0 0; }
  .grp { font-size:13px; color:var(--dim); margin-top:6px; }
  .run { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .run ul { margin:6px 0; padding-left:18px; color:var(--dim); font-size:12px; }
  pre.page { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; font:12px/1.5 ui-monospace, Consolas, monospace; }
  .build { margin-left:auto; background:var(--accent); color:#1a1a1a; border:none; font-weight:600; }
  .status { color:var(--dim); font-size:12px; margin-left:10px; }
  @media (max-width:760px) { body { flex-direction:column; } aside { width:auto; } .body { flex-direction:column; } .sub { width:auto; } main { padding:16px; } }
</style>
</head>
<body>
<aside>
  <div class="nav" style="font-weight:600">KastoBrain</div>
  <h4>PC Brain</h4>
  <div class="nav muted">PC Brain (coming in step 10)</div>
  <h4>Projects</h4>
  <div id="projects"></div>
  <h4>Sessions</h4>
  <div class="nav muted">None yet</div>
</aside>
<main id="main"><div class="muted">Loading…</div></main>

<script>
const TABS = ["Overview", "Files", "Brain", "Settings"];
const SUBS = ["Context", "Memory", "Apps", "Connectors", "Skills"];
let state = { project: null, settings: null, tab: "Overview", sub: "Context" };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadProjects() {
  const r = await fetch("/api/projects").then(r => r.json());
  const box = document.getElementById("projects");
  if (!r.projects.length) {
    box.innerHTML = '<div class="nav muted">No projects yet</div>';
    document.getElementById("main").innerHTML = `<div class="placeholder">No projects in ${esc(r.root)}\\Projects yet.<br>Create one with: python setup_layout.py ${esc(r.root)} --apply --project "Name"</div>`;
    return;
  }
  box.innerHTML = r.projects.map(p => `<a class="nav" data-p="${esc(p)}">${esc(p)}</a>`).join("");
  box.querySelectorAll("[data-p]").forEach(a => a.onclick = () => openProject(a.dataset.p));
  openProject(state.project || r.projects[0]);
}

async function openProject(name) {
  const r = await fetch("/api/project/" + encodeURIComponent(name)).then(r => r.json());
  state.project = r.name; state.settings = r.settings;
  document.querySelectorAll("[data-p]").forEach(a => a.classList.toggle("on", a.dataset.p === name));
  render();
}

function render() {
  const s = state.settings;
  const tabs = TABS.map(t => `<div class="tab ${t === state.tab ? "on" : ""}" data-t="${t}">${t}</div>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="crumb">Projects</div>
    <div class="title"><div class="dot">${esc(state.project[0] || "?")}</div>${esc(state.project)}<button class="build" id="buildBtn">Build Brain</button></div><div class="status" id="buildSt" style="margin:-8px 0 10px"></div>
    <div class="tabs">${tabs}</div>
    <div id="tabbody"></div>`;
  document.querySelectorAll("[data-t]").forEach(t => t.onclick = () => { state.tab = t.dataset.t; render(); });
  document.getElementById("buildBtn").onclick = startBuild;
  const body = document.getElementById("tabbody");
  if (state.tab === "Overview") body.innerHTML = `<div class="body"><div class="panel"><h3>Overview</h3><p class="hint">${esc(s.description)}</p><div class="placeholder">Sessions history arrives in step 8.</div></div></div>`;
  if (state.tab === "Files") body.innerHTML = `<div class="body"><div class="panel"><h3>Files</h3><p class="hint">Your PC folders, read in place.</p><div class="placeholder">Folder browsing arrives in step 3.<br>Folders set now: ${s.folders.length ? s.folders.map(esc).join("<br>") : "none"}</div></div></div>`;
  if (state.tab === "Brain") renderBrain(body);
  if (state.tab === "Settings") renderSettings(body);
}

function renderSettings(body) {
  const s = state.settings;
  const subs = SUBS.map(x => `<div class="nav ${x === state.sub ? "on" : ""}" data-s="${x}">${x}</div>`).join("");
  let panel = "";
  if (state.sub === "Context") panel = `
    <div class="section"><h3>Instructions</h3><p class="hint">Standing instructions. Dream reads these first on every run.</p>
      <textarea id="instructions">${esc(s.instructions)}</textarea></div>
    <div class="section"><h3>Description</h3><input type="text" id="description" value="${esc(s.description)}"></div>
    <div class="section"><h3>Folders</h3><p class="hint">PC folders this brain reads (one per line). Read only.</p>
      <textarea id="folders">${esc(s.folders.join("\n"))}</textarea></div>
    <div class="section"><h3>Never send</h3><p class="hint">Folders never sent to Claude or ChatGPT (one per line).</p>
      <textarea id="never_send">${esc(s.never_send.join("\n"))}</textarea></div>
    <div class="section"><h3>Links</h3><p class="hint">Websites to prioritise when researching (one per line).</p>
      <textarea id="links">${esc(s.links.join("\n"))}</textarea></div>
    <div class="section"><h3>AI</h3><select id="ai">
      <option value="claude" ${s.ai === "claude" ? "selected" : ""}>Claude</option>
      <option value="chatgpt" ${s.ai === "chatgpt" ? "selected" : ""}>ChatGPT / Codex</option></select></div>
    <button id="save">Save</button><span class="status" id="st"></span>`;
  if (state.sub === "Memory") {
    const m = s.memory;
    panel = `
    <div class="section"><h3>Brain</h3><p class="hint">Organise this project into a wiki. Every update waits in Pending for your approval.</p>
      <div class="row"><span>Automatically update Brain<br><small class="muted">Runs while the app is open. Results go to Pending.</small></span><select id="update_schedule" style="width:120px">
        ${["off","hourly","daily"].map(o => `<option ${m.update_schedule === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>
      <div class="row"><span>Manual update</span><button id="upd">Update now</button></div>
      <div class="row"><span>Use connectors</span><input type="checkbox" id="use_connectors" ${m.use_connectors ? "checked" : ""}></div></div>
    <div class="section"><h3>Project summary</h3>
      <div class="row"><span>Automatically update summary</span><input type="checkbox" id="auto_update_summary" ${m.auto_update_summary ? "checked" : ""}></div>
      <p class="hint" style="margin-top:10px">Summary instructions</p>
      <textarea id="summary_instructions">${esc(m.summary_instructions)}</textarea></div>
    <button id="save">Save</button><span class="status" id="st"></span>`;
  }
  if (state.sub === "Apps") panel = `<h3>Apps</h3><p class="hint">Connect apps and messaging channels.</p><div class="placeholder">Later, optional.</div>`;
  if (state.sub === "Connectors") panel = `<h3>Connectors</h3><p class="hint">Connector instructions and a locked credential vault on this PC.</p><div class="placeholder">Arrives in step 11.</div>`;
  if (state.sub === "Skills") panel = `<h3>Skills</h3><p class="hint">Reusable skills this brain can apply.</p><div class="placeholder">Arrives in step 11.</div>`;
  body.innerHTML = `<div class="body"><div class="sub">${subs}</div><div class="panel">${panel}</div></div>`;
  body.querySelectorAll("[data-s]").forEach(x => x.onclick = () => { state.sub = x.dataset.s; render(); });
  const upd = document.getElementById("upd"); if (upd) upd.onclick = startBuild;
  const save = document.getElementById("save");
  if (save) save.onclick = saveSettings;
}

async function saveSettings() {
  const lines = id => document.getElementById(id).value.split("\n").map(x => x.trim()).filter(Boolean);
  let changes;
  if (state.sub === "Context") changes = {
    instructions: document.getElementById("instructions").value,
    description: document.getElementById("description").value,
    folders: lines("folders"), never_send: lines("never_send"), links: lines("links"),
    ai: document.getElementById("ai").value };
  else changes = { memory: {
    update_schedule: document.getElementById("update_schedule").value,
    use_connectors: document.getElementById("use_connectors").checked,
    auto_update_summary: document.getElementById("auto_update_summary").checked,
    summary_instructions: document.getElementById("summary_instructions").value } };
  const r = await fetch("/api/project/" + encodeURIComponent(state.project) + "/settings",
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(changes) }).then(r => r.json());
  if (r.saved) { state.settings = r.settings; document.getElementById("st").textContent = "Saved (previous kept)"; }
  else document.getElementById("st").textContent = "Not saved: " + (r.error || "error");
}

state.brainView = "All";

async function renderBrain(body) {
  const [pg, pd] = await Promise.all([
    fetch(`/api/project/${encodeURIComponent(state.project)}/pages`).then(r => r.json()),
    fetch(`/api/project/${encodeURIComponent(state.project)}/pending`).then(r => r.json())]);
  const waiting = pd.runs.filter(r => r.status === "pending");
  const views = ["All", "Concepts", "Entities", "Workstreams", `Pending approval (${waiting.length})`];
  const side = views.map(v => {
    const key = v.startsWith("Pending") ? "Pending" : v;
    const kids = ["Concepts","Entities","Workstreams"].includes(v)
      ? pg.pages.filter(p => p.category === v).map(p => `<div class="nav" style="padding-left:22px;font-size:13px" data-page="${esc(p.category + "/" + p.file)}">${esc(p.title)}</div>`).join("") : "";
    return `<div class="nav ${state.brainView === key ? "on" : ""}" data-v="${key}">${esc(v)}</div>${kids}`;
  }).join("");
  let panel;
  if (state.brainView === "Pending") {
    panel = `<h3>Pending approval</h3><p class="hint">Nothing reaches the wiki until you approve it.</p>` +
      (pd.runs.length ? pd.runs.map(r => `<div class="run"><b>Run ${esc(r.run)}</b> <span class="muted">· ${esc(r.status)} · ${esc(r.ai)} · ${r.new_or_changed} new/changed of ${r.documents} documents</span>
        <ul><li>Added: ${r.added.map(esc).join(", ") || "none"}</li><li>Changed: ${r.changed.map(esc).join(", ") || "none"}</li><li>Removed: ${r.removed.map(esc).join(", ") || "none"}</li></ul>
        ${r.status === "pending" ? `<button data-a="approve" data-r="${esc(r.run)}">Approve</button> <button data-a="reject" data-r="${esc(r.run)}">Reject</button>` : ""}</div>`).join("")
      : `<div class="placeholder">No runs yet. Press Build Brain.</div>`);
  } else if (state.brainView.startsWith("page:")) {
    const p = pg.pages.find(p => p.category + "/" + p.file === state.brainView.slice(5));
    panel = p ? `<h3>${esc(p.title)}</h3><p class="hint">${esc(p.category)} · updated ${esc(p.updated)}</p><pre class="page">${esc(p.text)}</pre>` : "Page not found";
  } else {
    const cats = state.brainView === "All" ? ["Concepts","Entities","Workstreams"] : [state.brainView];
    const total = pg.pages.filter(p => cats.includes(p.category)).length;
    panel = `<h3>${esc(state.brainView)}</h3><p class="hint">${total} pages</p>` + (total ? cats.map(c => {
      const ps = pg.pages.filter(p => p.category === c);
      return ps.length ? `<div class="grp">${c}</div><div class="cards">${ps.map(p =>
        `<div class="card" data-page="${esc(p.category + "/" + p.file)}"><b>${esc(p.title)}</b><small>${esc(p.updated)}</small><p>${esc(p.summary)}</p></div>`).join("")}</div>` : "";
    }).join("") : `<div class="placeholder">The wiki is empty. Press Build Brain: it reads this brain's documents and builds the pages itself.</div>`);
  }
  body.innerHTML = `<div class="body"><div class="sub">${side}</div><div class="panel">${panel}</div></div>`;
  body.querySelectorAll("[data-v]").forEach(x => x.onclick = () => { state.brainView = x.dataset.v; render(); });
  body.querySelectorAll("[data-page]").forEach(x => x.onclick = () => { state.brainView = "page:" + x.dataset.page; render(); });
  body.querySelectorAll("[data-a]").forEach(x => x.onclick = async () => {
    const r = await fetch(`/api/project/${encodeURIComponent(state.project)}/${x.dataset.a}/${x.dataset.r}`, { method: "POST" }).then(r => r.json());
    if (!r.ok) alert(r.error || "failed");
    render();
  });
}

async function startBuild() {
  await fetch(`/api/project/${encodeURIComponent(state.project)}/build`, { method: "POST" });
  pollBuild();
}

async function pollBuild() {
  const st = document.getElementById("buildSt");
  const pd = await fetch(`/api/project/${encodeURIComponent(state.project)}/pending`).then(r => r.json());
  if (pd.running) {
    if (st) st.textContent = "Building… " + (pd.running[pd.running.length - 1] || "");
    setTimeout(pollBuild, 2000);
  } else {
    if (st) st.textContent = "Build finished. See Brain → Pending approval.";
    if (state.tab === "Brain") render();
  }
}

loadProjects();
</script>
</body>
</html>
