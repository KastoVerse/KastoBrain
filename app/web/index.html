<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KastoBrain</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg:#1E1D24; --side:#16151B; --panel:#26242E; --line:#3A3744; --text:#D8DAE0; --dim:#9A98A6;
    --gold:#c2a36a; --gold-dk:#7a5a18; --gold-hi:#e8d9b5;
    --silver:#C0C4C8; --silver-dk:#7D8288; --silver-hi:#F4F6F8;
    --purple:#5e2b8a; --twilight:#3a1d55; --violet:#9b6fc9; --plum:#4A1B2E;
    --metal-gold:linear-gradient(135deg,#7a5a18 0%,#c2a36a 30%,#e8d9b5 50%,#c2a36a 70%,#7a5a18 100%);
    --metal-silver:linear-gradient(135deg,#7D8288 0%,#C0C4C8 30%,#F4F6F8 50%,#C0C4C8 70%,#7D8288 100%);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Segoe UI", sans-serif; display:flex; min-height:100vh; position:relative; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(60% 50% at 85% 0%, rgba(94,43,138,.30), transparent 70%),
               radial-gradient(50% 45% at 10% 100%, rgba(94,43,138,.18), transparent 70%);
    animation:glow 18s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity:.65; } to { opacity:1; } }
  .gold-text { background:var(--metal-gold); -webkit-background-clip:text; background-clip:text; color:transparent; }
  aside { min-height:100vh; width:230px; background:var(--side); border-right:1px solid var(--line); padding:16px 10px; flex-shrink:0; }
  aside h4 { color:var(--dim); font-size:12px; font-weight:500; margin:18px 8px 6px; letter-spacing:.04em; text-transform:uppercase; }
  .logo { font-weight:700; font-size:17px; letter-spacing:.02em; padding:6px 8px; }
  .nav { display:block; padding:6px 8px; border-radius:6px; color:var(--text); cursor:pointer; text-decoration:none; }
  .nav:hover { background:rgba(94,43,138,.18); }
  .nav.on { background:rgba(94,43,138,.38); box-shadow:inset 2px 0 0 var(--gold); }
  .muted { color:var(--dim); }
  main { flex:1; padding:22px 32px; min-width:0; }
  .crumb { color:var(--dim); font-size:13px; }
  .title { display:flex; align-items:center; gap:12px; margin:18px 0; font-size:19px; }
  .dot { width:38px; height:38px; border-radius:50%; background:var(--metal-gold); display:grid; place-items:center; color:#1a1408; font-weight:800; box-shadow:0 0 18px rgba(194,163,106,.25); }
  .tabs { display:flex; gap:22px; border-bottom:1px solid var(--line); }
  .tab { padding:8px 0; cursor:pointer; color:var(--dim); border-bottom:2px solid transparent; }
  .tab:hover { color:var(--silver); }
  .tab.on { color:var(--gold); border-image:var(--metal-gold) 1; border-image-slice:0 0 1 0; border-bottom-width:2px; border-bottom-style:solid; }
  .body { display:flex; gap:28px; padding-top:18px; }
  .sub { width:210px; flex-shrink:0; }
  .panel { flex:1; max-width:760px; }
  .panel h3 { margin:0 0 4px; font-size:15px; display:inline-block; }
  .panel h3 + p.hint, .panel p.hint { color:var(--dim); font-size:12px; margin:0 0 10px; }
  textarea, input[type=text], select { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  textarea:focus, input:focus, select:focus { outline:none; border-color:var(--violet); box-shadow:0 0 0 2px rgba(155,111,201,.3); }
  input[type=checkbox] { accent-color:var(--gold); width:16px; height:16px; }
  textarea { min-height:90px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:16px; }
  button { background:var(--panel); color:var(--silver-hi); border:1px solid var(--silver-dk); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--silver); background:#2e2b38; }
  button:disabled { opacity:.5; cursor:default; }
  .section { margin-bottom:26px; }
  .placeholder { color:var(--dim); border:1px dashed var(--line); border-radius:8px; padding:24px; background:rgba(38,36,46,.6); }
  .cards { display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 22px; }
  .card { width:156px; min-height:150px; background:linear-gradient(180deg,#2a2833,#232129); border:1px solid var(--line); border-radius:9px; padding:10px; cursor:pointer; overflow:hidden; transition:border-color .2s, box-shadow .2s; }
  .card:hover { border-color:var(--gold); box-shadow:0 0 16px rgba(194,163,106,.2); }
  .card b { display:block; font-size:13px; } .card small { color:var(--dim); font-size:11px; }
  .card p { color:var(--dim); font-size:11px; margin:6px 0 0; }
  .card.Concepts { border-top:2px solid var(--gold); } .card.Entities { border-top:2px solid var(--silver); } .card.Workstreams { border-top:2px solid var(--violet); }
  .grp { font-size:12px; color:var(--silver); margin-top:6px; letter-spacing:.04em; text-transform:uppercase; }
  .run { border:1px solid var(--line); border-radius:9px; padding:12px; margin-bottom:10px; background:rgba(38,36,46,.7); }
  .run ul { margin:6px 0; padding-left:18px; color:var(--dim); font-size:12px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px; }
  .badge.pending { color:#111; background:var(--metal-silver); }
  .badge.approved { color:#1a1408; background:var(--metal-gold); }
  .badge.rejected, .badge.failed { color:#e9d6de; background:var(--plum); }
  .badge.nochanges { color:var(--dim); border:1px solid var(--line); }
  pre.page { white-space:pre-wrap; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; font:12px/1.5 ui-monospace, Consolas, monospace; }
  .build { margin-left:auto; background:var(--metal-gold); background-size:200% 200%; color:#1a1408; border:none; font-weight:700; padding:8px 16px; box-shadow:0 0 18px rgba(194,163,106,.25); transition:background-position .6s; }
  .build:hover, button.build:hover { background:var(--metal-gold); background-size:200% 200%; background-position:100% 100%; color:#1a1408; border:none; }
  .btnlink { display:inline-block; background:var(--panel); color:var(--silver-hi); border:1px solid var(--silver-dk); border-radius:6px; padding:6px 12px; text-decoration:none; font-size:14px; }
  .btnlink:hover { border-color:var(--silver); background:#2e2b38; }
  .m .btnlink { padding:2px 8px; font-size:12px; }
  .status { color:var(--dim); font-size:12px; margin-left:10px; }
  .status.building { color:var(--violet); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  .files { width:100%; border-collapse:collapse; font-size:13px; }
  .files td { padding:7px 8px; border-bottom:1px solid var(--line); }
  .files tr.dir td:first-child { cursor:pointer; }
  .files tr:hover td { background:rgba(94,43,138,.12); }
  .files .sz { color:var(--dim); text-align:right; white-space:nowrap; width:90px; }
  .files .dt { color:var(--dim); white-space:nowrap; width:110px; }
  .ico { display:inline-block; width:18px; color:var(--gold); }
  .tag { font-size:10px; padding:1px 7px; border-radius:9px; margin-left:6px; white-space:nowrap; }
  .tag.inbrain { color:#1a1408; background:var(--metal-gold); }
  .tag.never { color:#e9d6de; background:var(--plum); }
  .tag.skip { color:var(--dim); border:1px solid var(--line); }
  .crumbs { font-size:12px; color:var(--dim); margin-bottom:10px; word-break:break-all; }
  .crumbs a { color:var(--silver); cursor:pointer; }
  .ask { display:flex; gap:10px; margin-bottom:18px; }
  .ask textarea { min-height:48px; }
  .sess { border:1px solid var(--line); border-radius:9px; padding:12px; margin-bottom:10px; background:rgba(38,36,46,.7); }
  .sess .q { color:var(--gold); font-weight:600; margin-bottom:6px; }
  .sess .a { white-space:pre-wrap; font-size:13px; }
  .sess .m { color:var(--dim); font-size:11px; margin-top:6px; }
  table.pc { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:22px; }
  table.pc td, table.pc th { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; }
  table.pc th { color:var(--dim); font-weight:500; font-size:12px; }
  .globe-wrap { margin-top:18px; border-radius:12px; background:radial-gradient(circle at 50% 50%, rgba(94,43,138,.40), rgba(94,43,138,.12) 55%, transparent 75%); }
  .globe-wrap canvas { display:block; width:100%; cursor:grab; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--dim); padding:4px 6px 8px; }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }

  /* ---- metallic gold effects ---- */
  .metal, .panel h3, .tab.on, .logo {
    background:linear-gradient(100deg,#7a5a18 0%,#c2a36a 18%,#e8d9b5 30%,#c2a36a 42%,#9c7b34 55%,#c2a36a 68%,#f3e7c8 78%,#c2a36a 88%,#7a5a18 100%);
    background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:sheen 7s linear infinite; }
  @keyframes sheen { from { background-position:0% 0; } to { background-position:250% 0; } }
  .build, .dot { position:relative; overflow:hidden; }
  .build::after, .dot::after { content:""; position:absolute; top:-50%; left:-60%; width:40%; height:200%;
    background:linear-gradient(100deg, transparent, rgba(255,250,235,.75), transparent); transform:rotate(18deg);
    animation:sweep 4.5s ease-in-out infinite; pointer-events:none; }
  .dot::after { animation-delay:1.5s; }
  @keyframes sweep { 0%, 55% { left:-60%; } 85%, 100% { left:130%; } }
  .build::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(circle at 12% 30%, #fff 0 1px, transparent 2px),
      radial-gradient(circle at 38% 75%, #fff 0 1px, transparent 2px),
      radial-gradient(circle at 63% 22%, #fff 0 1px, transparent 2px),
      radial-gradient(circle at 86% 64%, #fff 0 1px, transparent 2px);
    animation:twinkle 2.8s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:0; } 40% { opacity:.9; } 60% { opacity:.2; } 80% { opacity:.8; } }
  .logo { position:relative; display:inline-block; }
  .sparkle { position:absolute; width:6px; height:6px; pointer-events:none; animation:twinkle 3.2s ease-in-out infinite; }
  .sparkle::before, .sparkle::after { content:""; position:absolute; left:50%; top:50%; background:#fffaf0; border-radius:1px; transform:translate(-50%,-50%); }
  .sparkle::before { width:6px; height:1.4px; } .sparkle::after { width:1.4px; height:6px; }
  .card:hover { border-color:transparent;
    box-shadow:0 0 0 1px #c2a36a, inset 0 1px 0 rgba(232,217,181,.55), inset 0 -2px 0 rgba(122,90,24,.7),
               inset 1px 0 0 rgba(232,217,181,.25), inset -1px 0 0 rgba(122,90,24,.5), 0 0 18px rgba(194,163,106,.25); }
  @media (prefers-reduced-motion: reduce) { .metal, .panel h3, .tab.on, .logo, .build::after, .dot::after, .build::before, .sparkle { animation:none; } }
  @media (max-width:760px) { body { flex-direction:column; } aside { width:auto; min-height:0; } .body { flex-direction:column; } .sub { width:auto; } main { padding:16px; } }
</style>
</head>
<style>
  aside { display:flex; flex-direction:column; }
  aside .grow { flex:1; }
  .nav .i { display:inline-block; width:22px; }
  .foot { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; font-size:11px; color:var(--dim); line-height:1.6; }
  .foot b { color:var(--silver); font-weight:500; }
  .bell { float:right; cursor:pointer; }
  .bell .n { background:var(--purple); color:#fff; border-radius:9px; padding:0 6px; font-size:10px; margin-left:3px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin:14px 0; }
  .tile { border-radius:12px; padding:16px; cursor:pointer; border:1px solid transparent; transition:transform .15s, box-shadow .15s; min-height:108px; }
  .tile:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.35); }
  .tile .ti { font-size:28px; }
  .tile b { display:block; font-size:15px; margin-top:6px; }
  .tile small { opacity:.85; font-size:12px; }
  .t-gold { background:linear-gradient(135deg,#7a5a18,#c2a36a 55%,#e8d9b5); color:#1a1408; }
  .t-silver { background:linear-gradient(135deg,#5E6268,#C0C4C8 55%,#F4F6F8); color:#111; }
  .t-purple { background:linear-gradient(135deg,#2e1446,#5e2b8a 60%,#7d45b0); color:#f1e8fa; }
  .t-violet { background:linear-gradient(135deg,#5e2b8a,#9b6fc9 60%,#cdb3ea); color:#1c0e2a; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center; color:var(--dim); margin-bottom:14px; }
  .drop.on { border-color:var(--gold); color:var(--gold); background:rgba(194,163,106,.06); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .stat .v { font-size:22px; font-weight:700; }
  .stat .k { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin:10px 0 22px; }
  .gcard { background:linear-gradient(180deg,#2a2833,#232129); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .gcard h4 { margin:0 0 4px; font-size:14px; }
  .gcard p { color:var(--dim); font-size:12px; margin:0 0 10px; }
  .pill { font-size:11px; padding:1px 8px; border-radius:9px; border:1px solid var(--line); color:var(--dim); margin-right:4px; }
  .pill.ok { color:#1a1408; background:var(--metal-gold); border:none; }
  .pill.no { color:#e9d6de; background:var(--plum); border:none; }
  .files td .desc { display:block; color:var(--dim); font-size:11px; }
  .files td .orig { color:var(--dim); font-size:10px; }
  .page-title { display:flex; align-items:center; gap:12px; margin:8px 0 18px; font-size:20px; }
  .names li { margin-bottom:4px; }
  code.cp { display:block; white-space:pre-wrap; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; }
</style>
</head>
<body>
<aside>
  <div class="logo">KastoBrain<span class="sparkle" style="left:-4px;top:2px"></span><span class="sparkle" style="right:-6px;top:-2px;animation-delay:1.1s"></span><span class="sparkle" style="left:48%;bottom:-3px;animation-delay:2s"></span></div>
  <a class="nav" data-page="pc" style="margin-top:14px"><span class="i">🧠</span>PC Brain</a>
  <h4>Brains</h4>
  <div id="projects"></div>
  <a class="nav" id="newBrain" style="color:var(--gold)" title="Create a new brain"><span class="i">＋</span>New brain</a>
  <h4>Tools</h4>
  <a class="nav" data-page="skills"><span class="i">🧩</span>Skills</a>
  <a class="nav" data-page="workflows"><span class="i">🔁</span>Workflows</a>
  <a class="nav" data-page="connectors"><span class="i">🔌</span>Connectors</a>
  <a class="nav" data-page="downloads"><span class="i">⬇</span>Downloads</a>
  <div class="grow"></div>
  <a class="nav" data-page="settings"><span class="i">⚙</span>Settings</a>
  <div class="foot" id="foot">Starting…</div>
</aside>
<div style="flex:1;display:flex;flex-direction:column;min-width:0">
<div id="updBar" style="display:none;padding:8px 18px;background:rgba(94,43,138,.92);border-bottom:1px solid var(--gold);font-size:13px"></div>
<main id="main"><div class="muted">Loading…</div></main>
</div>
<script>
const TABS = ["Overview", "Files", "Brain", "Settings"];
const SUBS = ["Context", "Personality", "Memory", "Connectors", "Skills"];
let state = { project: null, settings: null, tab: "Overview", sub: "Context", view: "project",
              filesPath: "", brainView: "All", root: "", help: false };

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = () => `/api/project/${encodeURIComponent(state.project)}`;
const getJSON = url => fetch(url).then(r => r.json());
const postJSON = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}) }).then(r => r.json());

// ---------- plain-English help for every tab ----------
const HELP = {
  Overview: `<b>Overview: ask your brain questions.</b><br>Type (or press 🎤 and speak) a question and press <b>Ask</b>.
    The answer comes from this brain's wiki, with sources. Asking never changes anything.
    Every answer is kept below; you can read it aloud (🔊) or download it (⬇).`,
  Files: `<b>Files: the documents this brain learns from.</b><br>Use the coloured tiles to <b>upload files</b>, a whole <b>folder</b> or a <b>zip</b>,
    or drag files onto this page. Uploads are copied into this brain; your originals stay where they are.
    Then press <b>Build Brain</b> (top right). Build Brain also reads each document and gives it a proper name and description; the renames happen when you approve.`,
  Brain: `<b>Brain: what KastoBrain has learned.</b><br>After <b>Build Brain</b>, it writes pages by itself:
    <b>Concepts</b> (ideas, issues), <b>Entities</b> (people, companies) and <b>Workstreams</b> (claims, jobs).
    New pages wait in <b>Pending approval</b> until you press Approve. Click any page or globe dot to open it.`,
  Settings: `<b>Settings: how this brain works.</b><br><b>Context</b>: instructions, extra PC folders, private folders, which AI does which job.
    <b>Personality</b>: tone, answer length and read-aloud voice. <b>Memory</b>: automatic updates. <b>Connectors</b>: extra tools this brain may use. <b>Skills</b>: run ready-made jobs. Press <b>Save</b> after changes.`,
};

// ---------- sidebar & start ----------
async function loadProjects() {
  const r = await getJSON("/api/projects");
  state.root = r.root;
  const box = document.getElementById("projects");
  box.innerHTML = r.projects.map(p => `<a class="nav" data-p="${esc(p)}">${esc(p)}</a>`).join("")
    || '<div class="nav muted" style="font-size:12px">No brains yet</div>';
  box.querySelectorAll("[data-p]").forEach(a => a.onclick = () => { state.filesPath = ""; state.brainView = "All"; openProject(a.dataset.p); });
  if (!r.projects.length) return renderWelcome();
  if (PAGES[state.view]) return PAGES[state.view]();
  openProject(r.projects.includes(state.project) ? state.project : r.projects[0]);
}

async function createBrain(name) {
  name = (name || "").trim(); if (!name) return;
  const r = await postJSON("/api/projects", { name });
  if (r.error) return alert(r.error);
  state.project = r.created; state.tab = "Files"; state.filesPath = ""; state.help = true; state.view = "project";
  loadProjects();
}

document.getElementById("newBrain").onclick = () => createBrain(prompt("Name for the new brain (for example: Insurance):"));
const PAGES = { pc: () => renderPC(), skills: () => renderSkillsPage(), workflows: () => renderWorkflows(),
  connectors: () => renderConnectors(), downloads: () => renderDownloads(), settings: () => renderAppSettings() };
document.querySelectorAll("aside [data-page]").forEach(a => a.onclick = () => { state.view = a.dataset.page; PAGES[a.dataset.page](); });
function setNav() {
  document.querySelectorAll("aside [data-page]").forEach(a => a.classList.toggle("on", a.dataset.page === state.view));
  document.querySelectorAll("[data-p]").forEach(a => a.classList.toggle("on", state.view === "project" && a.dataset.p === state.project));
}

function renderWelcome() {
  document.getElementById("main").innerHTML = `
    <div style="max-width:760px;margin:40px auto 0">
      <div style="display:flex;align-items:center;gap:16px"><img src="/icon.png" width="64" height="64" alt="">
        <div><div class="metal" style="font-size:30px;font-weight:700">Welcome to KastoBrain</div>
        <div class="muted">Your private second brain. Give it documents; it builds a linked wiki of what they say, with a source for every fact.</div></div></div>
      <h3 class="metal" style="margin-top:30px">Get started in 4 steps</h3>
      <div class="run"><b>① Create a brain</b><div class="muted">One brain per topic, for example "Insurance" or "House".</div>
        <div class="ask" style="margin:10px 0 0"><input type="text" id="wName" placeholder="Type a name, then press Create brain"><button class="build" id="wGo" style="margin:0">Create brain</button></div></div>
      <div class="run"><b>② Add your documents</b><div class="muted">In the <b>Files</b> tab press <b>Upload files</b>, <b>Upload folder</b> or <b>Upload zip</b>, or drag files in. Your originals are never changed.</div></div>
      <div class="run"><b>③ Press Build Brain</b><div class="muted">The AI reads everything, researches online, and writes the pages itself.</div></div>
      <div class="run"><b>④ Approve</b><div class="muted">Check the changes in <b>Brain → Pending approval</b>. Nothing goes in until you press Approve.</div></div>
    </div>`;
  const go = () => createBrain(document.getElementById("wName").value);
  document.getElementById("wGo").onclick = go;
  document.getElementById("wName").onkeydown = e => { if (e.key === "Enter") go(); };
}

async function openProject(name) {
  const r = await getJSON(`/api/project/${encodeURIComponent(name)}`);
  state.project = r.name; state.settings = r.settings; state.view = "project";
  setNav(); render();
}

function render() {
  const tabs = TABS.map(t => `<div class="tab ${t === state.tab ? "on" : ""}" data-t="${t}">${t}</div>`).join("");
  document.getElementById("main").innerHTML = `
    <div class="crumb">Projects</div>
    <div class="title"><div class="dot">${esc(state.project[0] || "?")}</div>${esc(state.project)}

      <button class="build" id="buildBtn" style="margin-left:10px" title="Read this brain's documents and build the wiki (results wait for your approval)">Build Brain</button></div>
    <div class="status" id="buildSt" style="margin:-8px 0 10px"></div>

    ${state.help ? `<div class="run" style="margin-top:12px;border-color:var(--gold)">${HELP[state.tab]}</div>` : ""}
    <div id="tabbody"></div>`;
  document.querySelectorAll("[data-t]").forEach(t => t.onclick = () => { state.tab = t.dataset.t; render(); });
  document.getElementById("helpBtn").onclick = () => { state.help = !state.help; render(); };

async function renderOverview(body) {
  const d = await getJSON(`${P()}/sessions`);
  const list = d.sessions.map(x => `<div class="sess"><div class="q">${esc(x.question)}</div>
    <div class="a">${esc(x.answer)}</div>
    <div class="m">${esc(x.time)} · ${esc(x.ai)} · ${x.seconds}s${x.ok ? "" : " · failed"}
      <button data-say="${esc(x.id)}" style="margin-left:10px;padding:2px 8px" title="Read this answer aloud">🔊 Read aloud</button>
      <a class="btnlink" download href="${P()}/download?session=${encodeURIComponent(x.id)}" title="Download this answer">⬇ Download</a></div></div>`).join("");
  body.innerHTML = `<div class="body"><div class="panel" style="max-width:900px">
    <h3>Ask this brain</h3><p class="hint">Type a question, or press 🎤 and speak. Press <b>Ask</b>. Answers come from this brain's wiki, with sources. Asking never changes anything.</p>
    <div class="ask"><textarea id="q" placeholder="For example: What is this claim about, and what happens next?"></textarea>
      <button id="micBtn" title="Speak your question" style="font-size:18px">🎤</button>
      <button class="build" id="askBtn" style="margin:0">Ask</button></div>
    <div class="status" id="askSt" style="margin:-8px 0 12px"></div>
    <h3>Answers</h3><p class="hint">Every question and answer is kept here. Build Brain also learns from them.</p>
    ${list || '<div class="placeholder">No questions yet. Ask one above. (If the wiki is empty, add documents in <b>Files</b> and press <b>Build Brain</b> first.)</div>'}</div></div>`;
  document.getElementById("askBtn").onclick = async () => {
    const q = document.getElementById("q").value.trim(); if (!q) return;
    const st = document.getElementById("askSt"); st.className = "status building"; st.textContent = "Thinking… (this can take a minute or two)";
    const r = await postJSON(`${P()}/ask`, { question: q });
    if (r.error) { st.className = "status"; st.textContent = r.error; return; }
    render();
  };
  document.getElementById("micBtn").onclick = () => listen(document.getElementById("q"), document.getElementById("micBtn"));
  body.querySelectorAll("[data-say]").forEach(b => b.onclick = () => {
    const x = d.sessions.find(s => s.id === b.dataset.say); if (x) speak(x.answer);
  });
}

function listen(box, btn) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert("Voice input isn't available in this browser. Open KastoBrain with the desktop icon (Edge) to use the mic.");
  const rec = new SR(); rec.lang = navigator.language || "en-AU"; rec.interimResults = true;
  const start = box.value ? box.value + " " : "";
  btn.textContent = "⏺"; btn.title = "Listening… click to stop";
  rec.onresult = e => { box.value = start + [...e.results].map(r => r[0].transcript).join(""); };
  rec.onend = () => { btn.textContent = "🎤"; btn.title = "Speak your question"; };
  rec.onerror = e => alert("Mic problem: " + e.error + ". Check Windows mic permission for Edge.");
  btn.onclick = () => rec.stop();
  rec.start();
}

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\[(page|file|web):[^\]]*\]/g, "").replace(/[#*_`>]/g, ""));
  const want = (state.settings.personality || {}).voice;
  const v = speechSynthesis.getVoices().find(v => v.name === want); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function renderFiles(body) {
  const [d, sum] = await Promise.all([getJSON(`${P()}/files?path=${encodeURIComponent(state.filesPath)}`), getJSON(`${P()}/summary`)]);
  if (d.error) { state.filesPath = ""; return renderFiles(body); }
  const size = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : n < 1073741824 ? (n / 1048576).toFixed(1) + " MB" : (n / 1073741824).toFixed(2) + " GB";
  const date = t => new Date(t * 1000).toLocaleDateString();
  const uploadHere = d.roots ? "" : (d.in_own ? d.own_rel : null);
  const rows = d.entries.map(e => `<tr class="${e.dir ? "dir" : ""}">
      <td ${e.dir && e.exists !== false ? `data-go="${esc(e.path)}"` : ""}><span class="ico">${e.dir ? (e.own ? "★" : "▸") : "·"}</span>${esc(e.title || e.name)}
        ${e.exists === false ? '<span class="tag skip">not found</span>' : ""}
        ${e.never_send ? '<span class="tag never">never send</span>' : ""}
        ${e.in_brain ? '<span class="tag inbrain">in brain</span>' : (!e.dir && e.readable ? '<span class="tag skip">new</span>' : "")}
        ${!e.dir && !e.readable ? '<span class="tag skip">not read</span>' : ""}
        ${e.description ? `<span class="desc">${esc(e.description)}</span>` : ""}
        ${e.title && e.title + "" !== e.name.replace(/\.[^.]+$/, "") ? `<span class="orig">file: ${esc(e.name)}${e.original && e.original !== e.name ? ` · was: ${esc(e.original)}` : ""}</span>` : ""}</td>
      <td class="dt">${e.mtime ? date(e.mtime) : ""}</td><td class="sz">${e.size != null ? size(e.size) : ""}</td>
      <td style="width:40px">${e.dir ? "" : `<a href="${P()}/download?path=${encodeURIComponent(e.path)}" title="Download this file" download>⬇</a>`}</td></tr>`).join("");
  const crumbs = d.roots ? "All folders of this brain" :
    `<a data-go="">All folders</a> › ${d.parent ? `<a data-go="${esc(d.parent)}">up</a> › ` : ""}${esc(d.path)}`;
  body.innerHTML = `<div class="body"><div class="panel" style="max-width:none" id="dropZone">
    <div class="stats">
      <div class="stat"><div class="v metal">${sum.documents}</div><div class="k">Documents</div></div>
      <div class="stat"><div class="v">${sum.in_brain}</div><div class="k">Already in the brain</div></div>
      <div class="stat"><div class="v" style="color:var(--violet)">${sum.new}</div><div class="k">New since last build</div></div>
      <div class="stat"><div class="v">${size(sum.bytes)}</div><div class="k">Total size</div></div>
      <div class="stat"><div class="v">${sum.pending}</div><div class="k">Waiting for approval</div></div>
    </div>
    <div class="tiles">
      <div class="tile t-gold" id="upFiles"><div class="ti">📄</div><b>Upload files</b><small>Pick one or more documents from your PC.</small></div>
      <div class="tile t-silver" id="upFolder"><div class="ti">📁</div><b>Upload folder</b><small>A whole folder, sub-folders included.</small></div>
      <div class="tile t-purple" id="upZip"><div class="ti">🗜</div><b>Upload zip</b><small>A zip file is unpacked into this brain.</small></div>
      <div class="tile t-violet" id="mkFolder"><div class="ti">➕</div><b>New folder</b><small>Organise: 01 Emails, 02 Letters…</small></div>
    </div>
    <div class="drop" id="dropHint">⬇ Drag files here to add them. Uploads are <b>copied</b> in; your originals are never changed.
      ${uploadHere === null ? "<br>You're viewing a linked PC folder, so uploads go to <b>This brain's files</b>." : ""}</div>
    <div class="status" id="upSt">${sum.new ? `${sum.new} new document(s). Press <b>Build Brain</b> to read them; it also names each one by what it is.` : ""}</div>
    <div class="crumbs">${crumbs}</div>
    ${d.entries.length ? `<table class="files">${rows}</table>` : `<div class="placeholder">This folder is empty. Use the tiles above, or drag files here.</div>`}

    <input type="file" id="pickZip" accept=".zip" style="display:none">
  </div></div>`;
  const dir = uploadHere === null ? "" : uploadHere;
  document.getElementById("upFiles").onclick = () => document.getElementById("pickFiles").click();
  document.getElementById("upFolder").onclick = () => document.getElementById("pickFolder").click();
  document.getElementById("upZip").onclick = () => document.getElementById("pickZip").click();
  document.getElementById("mkFolder").onclick = async () => {
    const name = prompt("New folder name (for example: 01 Emails Received):"); if (!name) return;
    const r = await fetch(`${P()}/mkdir?dir=${encodeURIComponent(dir)}&name=${encodeURIComponent(name)}`, { method: "POST" }).then(r => r.json());
    if (r.error) alert(r.error); render();
  };
  document.getElementById("pickFiles").onchange = e => uploadAll([...e.target.files], dir, false);
  document.getElementById("pickFolder").onchange = e => uploadAll([...e.target.files], dir, true);
  document.getElementById("pickZip").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const st = document.getElementById("upSt"); st.className = "status building"; st.textContent = `Unpacking ${f.name}…`;
    const r = await fetch(`${P()}/unzip?dir=${encodeURIComponent(dir)}&name=${encodeURIComponent(f.name)}`, { method: "POST", body: f }).then(r => r.json());
    await render();
    const s2 = document.getElementById("upSt"); if (s2) s2.textContent = r.error ? r.error : `Unpacked ${r.files} file(s) from ${f.name}. Press Build Brain when ready.`;
  };
  const zone = document.getElementById("dropZone"), hint = document.getElementById("dropHint");
  zone.ondragover = e => { e.preventDefault(); hint.classList.add("on"); };
  zone.ondragleave = () => hint.classList.remove("on");
  zone.ondrop = e => { e.preventDefault(); hint.classList.remove("on"); uploadAll([...e.dataTransfer.files], dir, false); };
  body.querySelectorAll("[data-go]").forEach(x => x.onclick = () => { state.filesPath = x.dataset.go; render(); });
}

async function uploadAll(files, dir, keepFolders) {
  const st = document.getElementById("upSt"); let done = 0, failed = 0;
  for (const f of files) {
    st.className = "status building"; st.textContent = `Uploading ${done + 1} of ${files.length}: ${f.name}`;
    const rel = keepFolders && f.webkitRelativePath ? `&rel=${encodeURIComponent(f.webkitRelativePath)}` : "";
    const r = await fetch(`${P()}/upload?dir=${encodeURIComponent(dir)}&name=${encodeURIComponent(f.name)}${rel}`,
      { method: "POST", body: f }).then(r => r.json()).catch(() => ({ error: "failed" }));
    r.error ? failed++ : done++;
  }
  state.filesPath = state.filesPath || "";
  await render();
  const s2 = document.getElementById("upSt");
  if (s2) { s2.className = "status"; s2.textContent = `Added ${done} file(s)${failed ? `, ${failed} failed` : ""}. Press Build Brain when you're ready.`; }
}

// ---------- Brain ----------
async function renderBrain(body) {
  const [pg, pd] = await Promise.all([getJSON(`${P()}/pages`), getJSON(`${P()}/pending`)]);
  const waiting = pd.runs.filter(r => r.status === "pending");
  const views = ["All", "Concepts", "Entities", "Workstreams", `Pending approval (${waiting.length})`];
  const side = views.map(v => {
    const key = v.startsWith("Pending") ? "Pending" : v;
    const kids = ["Concepts", "Entities", "Workstreams"].includes(v)
      ? pg.pages.filter(p => p.category === v).map(p => `<div class="nav" style="padding-left:22px;font-size:13px" data-page="${esc(p.category + "/" + p.file)}">${esc(p.title)}</div>`).join("") : "";
    return `<div class="nav ${state.brainView === key ? "on" : ""}" data-v="${key}">${esc(v)}</div>${kids}`;
  }).join("");
  let panel;
  if (state.brainView === "Pending") {
    panel = `<h3>Pending approval</h3><p class="hint">Each Build Brain run lands here first. Read the checks, then press <b>Approve</b> to put it into the wiki, or <b>Reject</b> to throw it away. Nothing reaches the wiki until you approve.</p>` +
      (pd.runs.length ? pd.runs.map(r => `<div class="run"><b>Run ${esc(r.run)}</b> <span class="badge ${esc(r.status.replace(" ", ""))}">${esc(r.status)}</span> <span class="muted">· ${esc(r.ai)} · ${r.new_or_changed} new/changed of ${r.documents} documents</span>
        <ul><li>Added: ${r.added.map(esc).join(", ") || "none"}</li><li>Changed: ${r.changed.map(esc).join(", ") || "none"}</li><li>Removed: ${r.removed.map(esc).join(", ") || "none"}</li></ul>
        ${namesHtml(r)}
        ${checksHtml(r)}
        ${r.status === "approved" && (r.names || []).some(n => n.new_path) ? `<button data-undo="${esc(r.run)}" title="Put the original file names back">↩ Undo renames</button> ` : ""}
        ${r.status === "pending" ? `<button data-a="approve" data-r="${esc(r.run)}">Approve</button> <button data-a="reject" data-r="${esc(r.run)}">Reject</button>` : ""}</div>`).join("")
      : `<div class="placeholder">No runs yet. Add documents in <b>Files</b>, then press <b>Build Brain</b>.</div>`);
  } else if (state.brainView.startsWith("page:")) {
    const p = pg.pages.find(p => p.category + "/" + p.file === state.brainView.slice(5));
    const path = p ? `${state.root}/Projects/${state.project}/wiki/${p.category}/${p.file}` : "";
    panel = p ? `<div style="display:flex;align-items:center"><h3>${esc(p.title)}</h3>
        <a class="btnlink" download href="${P()}/download?path=${encodeURIComponent(path)}" style="margin-left:auto" title="Download this page">⬇ Download page</a>
        <button id="sayPage" style="margin-left:6px" title="Read this page aloud">🔊 Read aloud</button></div>
      <p class="hint">${esc(p.category)} · updated ${esc(p.updated)}</p><pre class="page">${esc(p.text)}</pre>` : "Page not found";
    if (p) setTimeout(() => { const b = document.getElementById("sayPage"); if (b) b.onclick = () => speak(p.text.split("---").slice(2).join("---") || p.text); }, 0);
  } else {
    const cats = state.brainView === "All" ? ["Concepts", "Entities", "Workstreams"] : [state.brainView];
    const total = pg.pages.filter(p => cats.includes(p.category)).length;
    panel = `<h3>${esc(state.brainView)}</h3><p class="hint">${total} pages. Click a card to read it.</p>` + (total ? cats.map(c => {
      const ps = pg.pages.filter(p => p.category === c);
      return ps.length ? `<div class="grp">${c}</div><div class="cards">${ps.map(p =>
        `<div class="card ${p.category}" data-page="${esc(p.category + "/" + p.file)}"><b>${esc(p.title)}</b><small>${esc(p.updated)}</small><p>${esc(p.summary)}</p></div>`).join("")}</div>` : "";
    }).join("") : `<div class="placeholder">No pages yet. Add documents in <b>Files</b>, press <b>Build Brain</b>, then approve the result in <b>Pending approval</b>.</div>`);
  }
  body.innerHTML = `<div class="body"><div class="sub">${side}<div class="globe-wrap"><canvas id="globe" width="420" height="420"></canvas>
    <div class="legend"><span><i style="background:#c2a36a"></i>Concepts</span><span><i style="background:#C0C4C8"></i>Entities</span><span><i style="background:#9b6fc9"></i>Workstreams</span></div></div></div><div class="panel">${panel}</div></div>`;
  drawGlobe(document.getElementById("globe"), pg.pages);
  body.querySelectorAll("[data-v]").forEach(x => x.onclick = () => { state.brainView = x.dataset.v; render(); });
  body.querySelectorAll("[data-page]").forEach(x => x.onclick = () => { state.brainView = "page:" + x.dataset.page; render(); });
  body.querySelectorAll("[data-undo]").forEach(x => x.onclick = async () => {
    if (!confirm("Put the original file names back for this run?")) return;
    const r = await fetch(`${P()}/undo-names/${x.dataset.undo}`, { method: "POST" }).then(r => r.json());
    alert(`${r.undone} file(s) renamed back.`); render();
  });
  body.querySelectorAll("[data-a]").forEach(x => x.onclick = async () => {
    const r = await fetch(`${P()}/${x.dataset.a}/${x.dataset.r}`, { method: "POST" }).then(r => r.json());
    if (!r.ok) alert(r.error || "failed");
    render();
  });
}

function namesHtml(r) {
  const ns = r.names || [];
  if (!ns.length) return "";
  const base = p => p.split(/[\\/]/).pop();
  return `<div style="margin-top:6px"><b>Document names</b> <span class="muted">(${ns.filter(n => n.new_path).length} to rename on approval; originals elsewhere are never touched)</span>
    <ul class="names">${ns.slice(0, 40).map(n => `<li>${esc(base(n.path))} → <b>${esc(n.name || "(no name)")}</b>${n.new_path ? "" : ' <span class="muted">(linked PC file: name shown only, not renamed)</span>'}
      ${n.description ? `<br><span class="muted">${esc(n.description)}</span>` : ""}</li>`).join("")}</ul></div>`;
}

function checksHtml(r) {
  let h = "";
  const q = r.quote_check;
  if (q) {
    const c = q.counts || {}, bad = q.problems.filter(p => p.status === "NOT FOUND").length;
    h += `<div style="margin-top:6px"><b>Quote check</b> <span class="muted">(plain code, no AI)</span>:
      <span class="badge ${bad ? "rejected" : "approved"}">${c.verified || 0} verified</span>
      ${bad ? `<span class="badge rejected">${bad} NOT FOUND</span>` : ""}
      <span class="muted">${Object.entries(c).filter(([k]) => !["verified", "NOT FOUND"].includes(k)).map(([k, v]) => `${v} ${esc(k)}`).join(" · ")}</span></div>`;
    if (q.problems.length) h += `<ul>${q.problems.slice(0, 20).map(p => `<li>${esc(p.status)}: ${esc(p.page)} [^${esc(p.ref)}]${p.quote ? ` "${esc(p.quote)}"` : ""}</li>`).join("")}</ul>`;
  }
  const k = r.checker;
  if (k) h += `<div style="margin-top:6px"><b>Checker</b> <span class="muted">(${esc(k.ai)})</span>:
      <span class="badge ${k.verdict === "OK" ? "approved" : k.verdict === "ISSUES" ? "rejected" : "pending"}">${esc(k.verdict)}</span>
      <details><summary class="muted" style="cursor:pointer">Read the checker's report</summary><pre class="page">${esc(k.report)}</pre></details></div>`;
  return h;
}

    <div id="brainSkills" class="muted">Loading…</div>`;
  body.innerHTML = `<div class="body"><div class="sub">${subs}</div><div class="panel">${panel}</div></div>`;

  if (state.sub === "Connectors") fillBrainConnectors();

    const fill = () => { const sel = document.getElementById("voice"); if (!sel) return;
      const want = (s.personality || {}).voice || "";
      sel.innerHTML = `<option value="">Windows default</option>` + speechSynthesis.getVoices().map(v =>
        `<option ${v.name === want ? "selected" : ""}>${esc(v.name)}</option>`).join(""); };
    fill(); speechSynthesis.onvoiceschanged = fill;
    document.getElementById("testVoice").onclick = () => {

      const v = speechSynthesis.getVoices().find(v => v.name === document.getElementById("voice").value); if (v) u.voice = v;
      speechSynthesis.speak(u);
    };
  }
}

async function saveSettings() {
  const lines = id => document.getElementById(id).value.split("\n").map(x => x.trim()).filter(Boolean);
  let changes;
  if (state.sub === "Context") changes = {
    instructions: document.getElementById("instructions").value, description: document.getElementById("description").value,
    folders: lines("folders"), never_send: lines("never_send"), links: lines("links"),
    ai: document.getElementById("ai").value, ai_ask: document.getElementById("ai_ask").value, ai_check: document.getElementById("ai_check").value };
  else if (state.sub === "Connectors") changes = { connectors: [...document.querySelectorAll("[data-conn]:checked")].map(x => x.dataset.conn) };
  else if (state.sub === "Personality") changes = { personality: {
    tone: document.getElementById("tone").value, length: document.getElementById("length").value, voice: document.getElementById("voice").value } };
  else changes = { memory: {
    update_schedule: document.getElementById("update_schedule").value, use_connectors: document.getElementById("use_connectors").checked,
    auto_update_summary: document.getElementById("auto_update_summary").checked, summary_instructions: document.getElementById("summary_instructions").value } };
  const r = await postJSON(`${P()}/settings`, changes);
  if (r.saved) { state.settings = r.settings; document.getElementById("st").textContent = "Saved ✓"; }
  else document.getElementById("st").textContent = "Not saved: " + (r.error || "error");
}

async function pollBuild() {
  const st = document.getElementById("buildSt");
  const pd = await getJSON(`${P()}/pending`);

    if (state.tab === "Brain") render();

async function checkUpdate(manual) {

  if (u.error) { bar.style.display = "block"; bar.innerHTML = `Couldn't check for updates: ${esc(u.error)}. ${esc(u.detail || "")} <button id="updLater" style="margin-left:8px;padding:2px 8px">OK</button>`;
    document.getElementById("updLater").onclick = () => bar.style.display = "none"; return; }
  if (!u.available) { if (manual) { bar.style.display = "block"; bar.innerHTML = `You're on the latest version. <button id="updLater" style="margin-left:8px;padding:2px 8px">OK</button>`;
    document.getElementById("updLater").onclick = () => bar.style.display = "none"; } return; }
  bar.style.display = "block";
  bar.innerHTML = `<b class="metal">Update available</b> · ${u.changes.length} change(s): ${esc(u.changes.slice(0, 3).map(c => c.replace(/^\w+ /, "")).join("; "))}
    <button class="build" id="updGo" style="margin-left:12px;padding:4px 12px">Update now</button>

// ---------- Globe ----------
const METAL = { Concepts: ["#e8d9b5", "#c2a36a", "#7a5a18"], Entities: ["#F4F6F8", "#C0C4C8", "#5E6268"], Workstreams: ["#d9c3f0", "#9b6fc9", "#5e2b8a"] };
let globeTimer = null;
function drawGlobe(cv, pages) {
  if (globeTimer) cancelAnimationFrame(globeTimer);
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, R = W * 0.40;
  const n = Math.max(pages.length, 1), golden = Math.PI * (3 - Math.sqrt(5));
  const nodes = pages.map((p, i) => { const y = 1 - (i + 0.5) / n * 2, r = Math.sqrt(1 - y * y), t = golden * i; return { p, x: Math.cos(t) * r, y, z: Math.sin(t) * r }; });
  const byTitle = Object.fromEntries(nodes.map(nd => [nd.p.title.toLowerCase(), nd]));
  const edges = [];
  nodes.forEach(a => (a.p.text.match(/\[\[([^\]]+)\]\]/g) || []).forEach(m => {
    const b = byTitle[m.slice(2, -2).toLowerCase()];
    if (b && b !== a && !edges.some(e => e[0] === b && e[1] === a)) edges.push([a, b]);
  }));
  let rotY = 0, rotX = -0.35, drag = null, moved = false, shown = [];
  const project = nd => {
    const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
    const x1 = nd.x * cy + nd.z * sy, z1 = -nd.x * sy + nd.z * cy, y2 = nd.y * cx - z1 * sx, z2 = nd.y * sx + z1 * cx;
    const s = 1 / (1.9 - z2 * 0.5);
    return { X: W / 2 + x1 * R * s * 1.35, Y: H / 2 + y2 * R * s * 1.35, Z: z2, s };
  };
  function frame() {
    if (!document.body.contains(cv)) return;
    if (!drag) rotY += 0.0035;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(192,196,200,0.10)"; ctx.lineWidth = 1;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); const yy = k / 3;
      ctx.ellipse(W / 2, H / 2 + yy * R * 0.95 * Math.cos(rotX), R * Math.sqrt(1 - yy * yy) * 1.02, R * Math.sqrt(1 - yy * yy) * 0.28, 0, 0, Math.PI * 2); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(W / 2, H / 2, R * 1.02, 0, Math.PI * 2); ctx.strokeStyle = "rgba(192,196,200,0.18)"; ctx.stroke();
    const Pm = new Map(nodes.map(nd => [nd, project(nd)]));
    edges.forEach(([a, b]) => { const A = Pm.get(a), B = Pm.get(b), depth = (A.Z + B.Z + 2) / 4;
      const g = ctx.createLinearGradient(A.X, A.Y, B.X, B.Y);
      g.addColorStop(0, `rgba(194,163,106,${0.15 + depth * 0.45})`); g.addColorStop(1, `rgba(192,196,200,${0.15 + depth * 0.45})`);
      ctx.strokeStyle = g; ctx.lineWidth = 1 + depth; ctx.beginPath(); ctx.moveTo(A.X, A.Y); ctx.lineTo(B.X, B.Y); ctx.stroke(); });
    shown = [...Pm.entries()].sort((a, b) => a[1].Z - b[1].Z);
    shown.forEach(([nd, q]) => { const c = METAL[nd.p.category] || METAL.Entities, rad = 13 * q.s * 2;
      const g = ctx.createRadialGradient(q.X - rad * 0.35, q.Y - rad * 0.4, rad * 0.1, q.X, q.Y, rad);
      g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, c[2]);
      ctx.globalAlpha = 0.45 + (q.Z + 1) * 0.275; ctx.shadowColor = c[1]; ctx.shadowBlur = 16;
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.X, q.Y, rad, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1; q.r = rad; });
    if (!nodes.length) { ctx.fillStyle = "#9A98A6"; ctx.font = "13px system-ui"; ctx.textAlign = "center"; ctx.fillText("No pages yet", W / 2, H / 2); }
    globeTimer = requestAnimationFrame(frame);
  }
  const pos = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * W / b.width, (e.clientY - b.top) * H / b.height]; };
  const hitAt = (x, y) => [...shown].reverse().find(([, q]) => Math.hypot(q.X - x, q.Y - y) < q.r + 3);
  cv.onpointerdown = e => { drag = pos(e); moved = false; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { const [x, y] = pos(e);
    if (drag) { rotY += (x - drag[0]) * 0.01; rotX = Math.max(-1.2, Math.min(1.2, rotX + (y - drag[1]) * 0.01)); if (Math.abs(x - drag[0]) + Math.abs(y - drag[1]) > 2) moved = true; drag = [x, y]; return; }
    const hit = hitAt(x, y); cv.title = hit ? hit[0].p.title : ""; cv.style.cursor = hit ? "pointer" : "grab"; };
  cv.onpointerup = e => { const [x, y] = pos(e); drag = null; if (moved) return;
    const hit = hitAt(x, y); if (hit) { state.brainView = "page:" + hit[0].p.category + "/" + hit[0].p.file; render(); } };
  frame();
}

  ["🐙", "GitHub", "Not built in yet. Add a GitHub MCP server below as a custom connector.", "soon"],
  ["💬", "Slack", "Not built in yet. Add a Slack MCP server below as a custom connector.", "soon"],
  ["📝", "Notion", "Not built in yet. Add a Notion MCP server below as a custom connector.", "soon"],
];

async function renderConnectors() {
  state.view = "connectors";
  const [a, st, pr] = await Promise.all([getJSON("/api/app-settings"), getJSON("/api/ai-status"), getJSON("/api/projects")]);
  const mc = a.settings.mcp_connectors || [];
  const cmd = a.mcp_command.map(x => x.includes(" ") ? `"${x}"` : x).join(" ");
  const agents = st.ais.map(x => `<div class="gcard"><h4>${esc(x.label)}</h4>
      <p>${x.installed ? "Installed on this PC." : "Not installed on this PC."} ${x.mcp === true ? "KastoBrain is connected: this AI can read your brains." : ""}</p>
      ${x.installed && x.key !== "grok" ? (x.mcp === true ? `<button data-mcp="${x.key}" data-on="0">Disconnect</button>` : `<button class="build" style="margin:0" data-mcp="${x.key}" data-on="1">Connect</button>`)
        : x.installed ? '<span class="pill">use the copy-paste setup below</span>' : '<span class="pill no">install it first</span>'}</div>`).join("");
  const apps = APP_CARDS.map(([i, n, d, k]) => `<div class="gcard"><h4>${i} ${n}</h4><p>${d}</p>
      ${k === "folder" ? `<button data-link="${n}">Link a folder…</button>` : k === "soon" ? '<span class="pill">coming later</span>' : '<span class="pill ok">available</span>'}</div>`).join("");
  const custom = mc.map((m, i) => `<div class="gcard"><h4>🧩 ${esc(m.name)}</h4><p>${esc(m.url || (Array.isArray(m.command) ? m.command.join(" ") : m.command) || "")}</p>
      <button data-del="${i}">Remove</button></div>`).join("");
  pageShell("🔌", "Connectors", "Connect KastoBrain to your AI apps and to other tools. Nothing is connected until you press a button, and you're asked first.", `
    <h3>Your AI agents</h3><p class="hint">Connect KastoBrain so these AI apps can read your brains and start Build Brain (MCP). They can't approve, delete or move anything.</p>
    <div class="grid">${agents}</div>
    <details><summary class="muted" style="cursor:pointer">Copy-paste setup for any other MCP app</summary>
      <code class="cp">${esc(cmd)}</code></details>
    <h3 style="margin-top:22px">Apps and files</h3><div class="grid">${apps}</div>
    <h3>Custom MCP connectors</h3><p class="hint">Add any tool that has an MCP server. Then switch it on per brain (brain → Settings → Connectors). Brains only use connectors you switch on.</p>
    <div class="grid">${custom || '<div class="placeholder">None yet.</div>'}</div>
    <div class="run"><b>+ Add MCP connector</b>
      <p class="hint" style="margin:8px 0 4px">Name</p><input type="text" id="mName" placeholder="for example: github">
      <p class="hint" style="margin:8px 0 4px">Server address (URL) <i>or</i> command to start it</p><input type="text" id="mTarget" placeholder="https://… or: npx -y @modelcontextprotocol/server-github">
      <button class="build" id="mAdd" style="margin-top:10px">Add connector</button>
      <p class="hint" style="margin-top:8px">Custom connectors work with Claude Code and Codex. Keys or passwords are never stored here; set them the way that tool's own instructions say.</p></div>`);
  document.querySelectorAll("[data-mcp]").forEach(b => b.onclick = async () => {
    const on = b.dataset.on === "1", label = st.ais.find(x => x.key === b.dataset.mcp).label;
    if (!confirm(`${on ? "Connect" : "Disconnect"} KastoBrain ${on ? "to" : "from"} ${label}?`)) return;
    b.textContent = "Working…";
    const r = await postJSON("/api/mcp/connect", { key: b.dataset.mcp, connect: on });
    alert((r.ok ? "Done. " : "Didn't work. ") + (r.message || "")); renderConnectors(); refreshFoot();
  });
  document.querySelectorAll("[data-link]").forEach(b => b.onclick = async () => {
    const brains = pr.projects; if (!brains.length) return alert("Create a brain first.");
    const brainName = prompt(`Which brain should read your ${b.dataset.link} folder?\n${brains.join(", ")}`, brains[0]); if (!brainName) return;
    const folder = prompt(`Paste the ${b.dataset.link} folder path (open it in File Explorer and copy the address bar):`); if (!folder) return;
    const cur = await getJSON(`/api/project/${encodeURIComponent(brainName)}`); if (cur.error) return alert("No brain called " + brainName);
    const r = await postJSON(`/api/project/${encodeURIComponent(brainName)}/settings`, { folders: [...cur.settings.folders, folder] });
    alert(r.saved ? `Linked. ${brainName} will read that folder on its next Build Brain.` : "Not saved.");
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this connector?")) return;
    mc.splice(+b.dataset.del, 1); await postJSON("/api/app-settings", { mcp_connectors: mc }); renderConnectors();
  });
  document.getElementById("mAdd").onclick = async () => {
    const name = document.getElementById("mName").value.trim(), t = document.getElementById("mTarget").value.trim();
    if (!name || !t) return alert("Give it a name and a URL or command.");
    mc.push(/^https?:\/\//.test(t) ? { name, url: t } : { name, command: t });
    await postJSON("/api/app-settings", { mcp_connectors: mc }); renderConnectors();
  };
}

async function fillBrainConnectors() {
  const a = await getJSON("/api/app-settings"), box = document.getElementById("brainConn"); if (!box) return;
  const mine = new Set(state.settings.connectors || []);
  const mc = a.settings.mcp_connectors || [];
  box.innerHTML = mc.length ? mc.map(m => `<div class="row"><span>🧩 <b>${esc(m.name)}</b><br><small class="muted">${esc(m.url || m.command)}</small></span>
      <input type="checkbox" data-conn="${esc(m.name)}" ${mine.has(m.name) ? "checked" : ""}></div>`).join("") + '<button class="build" id="save" style="margin-top:12px">Save</button><span class="status" id="st"></span>'
    : 'No custom connectors yet. Add them on the <b>Connectors</b> page in the sidebar.';
  const sv = document.getElementById("save"); if (sv) sv.onclick = saveSettings;
}

// ---------- 🧩 Skills ----------
async function renderSkillsPage() {
  state.view = "skills";
  const [k, pr] = await Promise.all([getJSON("/api/skills"), getJSON("/api/projects")]);
  const cards = k.skills.map(sk => `<div class="gcard"><h4>${esc(sk.icon)} ${esc(sk.name)} ${sk.builtin ? '<span class="pill">built-in</span>' : ""}</h4>
      <p>${esc(sk.description)}</p>
      <select data-brain="${esc(sk.id)}" style="width:auto">${pr.projects.map(p => `<option>${esc(p)}</option>`).join("")}</select>
      <button class="build" style="margin:6px 0 0" data-run="${esc(sk.id)}" ${pr.projects.length ? "" : "disabled"}>Run</button>
      <button data-edit="${esc(sk.id)}" style="margin-top:6px">Edit</button>
      ${sk.builtin ? "" : `<button data-rm="${esc(sk.id)}" style="margin-top:6px">Remove</button>`}</div>`).join("");
  pageShell("🧩", "Skills", "Ready-made jobs you can run on any brain. Pick a brain and press <b>Run</b>. The result is saved as a report (see <b>Downloads</b>). Skills only read; they never change a brain.", `
    <div class="grid">${cards}</div>
    <div class="run" id="skForm"><b id="skTitle">+ Make your own skill</b>
      <input type="hidden" id="skId">
      <p class="hint" style="margin:8px 0 4px">Name</p><input type="text" id="skName" placeholder="for example: Deadlines">
      <p class="hint" style="margin:8px 0 4px">One-line description</p><input type="text" id="skDesc" placeholder="Every deadline and what's due">
      <p class="hint" style="margin:8px 0 4px">Instructions: what should it do?</p><textarea id="skPrompt" placeholder="List every deadline, due date and time limit in this brain, soonest first, with sources."></textarea>
      <button class="build" id="skSave" style="margin-top:10px">Save skill</button></div>`);
  document.querySelectorAll("[data-run]").forEach(b => b.onclick = async () => {
    const brainName = document.querySelector(`[data-brain="${b.dataset.run}"]`).value;
    const r = await fetch(`/api/project/${encodeURIComponent(brainName)}/skill/${encodeURIComponent(b.dataset.run)}`, { method: "POST" }).then(r => r.json());
    alert(r.started ? `Running on ${brainName}. You'll get a notification (🔔) when the report is ready in Downloads.` : (r.error || "A skill is already running on that brain."));
    refreshFoot();
  });
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const sk = k.skills.find(x => x.id === b.dataset.edit);
    document.getElementById("skTitle").textContent = "Edit: " + sk.name; document.getElementById("skId").value = sk.id;
    document.getElementById("skName").value = sk.name; document.getElementById("skDesc").value = sk.description;
    document.getElementById("skPrompt").value = sk.prompt; document.getElementById("skForm").scrollIntoView();
  });
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this skill? (It is kept in the Skills folder as .removed.json.)")) return;
    await postJSON("/api/skills/delete", { id: b.dataset.rm }); renderSkillsPage();
  });
  document.getElementById("skSave").onclick = async () => {
    const r = await postJSON("/api/skills", { id: document.getElementById("skId").value || undefined, name: document.getElementById("skName").value,
      description: document.getElementById("skDesc").value, prompt: document.getElementById("skPrompt").value });
    if (r.error) return alert(r.error); renderSkillsPage();
  };
}

async function fillBrainSkills() {
  const [k, rp] = await Promise.all([getJSON("/api/skills"), getJSON(`${P()}/reports`)]);
  const box = document.getElementById("brainSkills"); if (!box) return;
  box.innerHTML = `<div class="grid">${k.skills.map(sk => `<div class="gcard"><h4>${esc(sk.icon)} ${esc(sk.name)}</h4><p>${esc(sk.description)}</p>
      <button class="build" style="margin:0" data-srun="${esc(sk.id)}" ${rp.running ? "disabled" : ""}>Run</button></div>`).join("")}</div>
    ${rp.running ? `<p class="status building">Running: ${esc(rp.running)}…</p>` : ""}
    <h3>Reports for this brain</h3>${rp.reports.length ? `<table class="files">${rp.reports.map(r => `<tr><td>${esc(r.name)}</td>
      <td style="width:40px"><a href="${P()}/download?path=${encodeURIComponent(r.path)}" download title="Download">⬇</a></td></tr>`).join("")}</table>` : '<div class="placeholder">No reports yet.</div>'}`;
  box.querySelectorAll("[data-srun]").forEach(b => b.onclick = async () => {
    await fetch(`${P()}/skill/${encodeURIComponent(b.dataset.srun)}`, { method: "POST" }); fillBrainSkills(); refreshFoot();
  });
  if (rp.running) setTimeout(() => { if (state.sub === "Skills" && document.getElementById("brainSkills")) fillBrainSkills(); }, 5000);
}

// ---------- 🔁 Workflows ----------
async function renderWorkflows() {
  state.view = "workflows";
  const [w, pr, k] = await Promise.all([getJSON("/api/workflows"), getJSON("/api/projects"), getJSON("/api/skills")]);
  const items = w.workflows;
  const TRIG = { manual: "Only when I press Run", new_files: "When new files are added", daily: "Every day", weekly: "Every week" };
  const stepName = s => s === "build" ? "Build Brain (+ checker) → Pending" : (k.skills.find(x => "skill:" + x.id === s) || { name: s }).name + " report";
  const rows = items.map((x, i) => `<div class="gcard"><h4>🔁 ${esc(x.name)}</h4>
      <p><b>Brain:</b> ${esc(x.brain || "(none)")} · <b>When:</b> ${TRIG[x.trigger]}<br><b>Steps:</b> ${x.steps.map(stepName).map(esc).join(" → ") || "none"}${x.notify ? " → 🔔 notify me" : ""}<br>
      <b>Last run:</b> ${esc(x.last_run || "never")} · ${x.enabled ? '<span class="pill ok">on</span>' : '<span class="pill">off</span>'}</p>
      <button class="build" style="margin:0" data-wrun="${esc(x.id)}">Run now</button> <button data-wtog="${i}">${x.enabled ? "Turn off" : "Turn on"}</button> <button data-wdel="${i}">Remove</button></div>`).join("");
  pageShell("🔁", "Workflows", "Chains of jobs that run by themselves. Builds from workflows still wait in <b>Pending approval</b>; nothing goes into a brain without you. Automatic workflows run while KastoBrain is open.", `
    <div class="grid">${rows || '<div class="placeholder">No workflows yet. Make one below.</div>'}</div>
    <div class="run"><b>+ New workflow</b>
      <p class="hint" style="margin:8px 0 4px">Start from</p><select id="wTpl">${w.templates.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join("")}<option value="-1">Blank</option></select>
      <p class="hint" style="margin:8px 0 4px">Brain</p><select id="wBrain">${pr.projects.map(p => `<option>${esc(p)}</option>`).join("")}</select>
      <p class="hint" style="margin:8px 0 4px">When</p><select id="wTrig">${Object.entries(TRIG).map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>
      <p class="hint" style="margin:8px 0 4px">Steps (tick in order)</p>
      <div class="row"><span>Build Brain (+ checker) → Pending approval</span><input type="checkbox" data-step="build"></div>
      ${k.skills.map(sk => `<div class="row"><span>${esc(sk.icon)} ${esc(sk.name)} report</span><input type="checkbox" data-step="skill:${esc(sk.id)}"></div>`).join("")}
      <div class="row"><span>🔔 Notify me when it finishes</span><input type="checkbox" id="wNote" checked></div>
      <p class="hint" style="margin:8px 0 4px">Name</p><input type="text" id="wName">
      <button class="build" id="wAdd" style="margin-top:10px" ${pr.projects.length ? "" : "disabled"}>Save workflow</button></div>`);
  const applyTpl = () => { const t = w.templates[+document.getElementById("wTpl").value];
    document.getElementById("wName").value = t ? t.name : ""; if (t) document.getElementById("wTrig").value = t.trigger;
    document.querySelectorAll("[data-step]").forEach(c => c.checked = !!t && t.steps.includes(c.dataset.step)); };
  document.getElementById("wTpl").onchange = applyTpl; applyTpl();
  document.getElementById("wAdd").onclick = async () => {
    const steps = [...document.querySelectorAll("[data-step]:checked")].map(c => c.dataset.step);
    if (!steps.length) return alert("Tick at least one step.");
    items.push({ name: document.getElementById("wName").value || "Workflow", brain: document.getElementById("wBrain").value,
      trigger: document.getElementById("wTrig").value, steps, notify: document.getElementById("wNote").checked, enabled: true });
    await postJSON("/api/workflows", { workflows: items }); renderWorkflows();
  };
  document.querySelectorAll("[data-wrun]").forEach(b => b.onclick = async () => {
    const r = await postJSON("/api/workflows/run", { id: b.dataset.wrun });
    alert(r.started ? "Started. You'll get a notification (🔔) when it finishes." : "Couldn't start (check the brain still exists)."); refreshFoot();
  });
  document.querySelectorAll("[data-wtog]").forEach(b => b.onclick = async () => { items[+b.dataset.wtog].enabled = !items[+b.dataset.wtog].enabled; await postJSON("/api/workflows", { workflows: items }); renderWorkflows(); });
  document.querySelectorAll("[data-wdel]").forEach(b => b.onclick = async () => { if (!confirm("Remove this workflow?")) return; items.splice(+b.dataset.wdel, 1); await postJSON("/api/workflows", { workflows: items }); renderWorkflows(); });
}

// ---------- ⬇ Downloads ----------
async function renderDownloads() {
  state.view = "downloads";
  const d = await getJSON("/api/downloads");
  const size = n => n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB";
  const rows = d.files.map(f => `<tr><td>${f.name.endsWith(".zip") ? "🗜" : "📄"} ${esc(f.name)}</td><td class="dt">${new Date(f.mtime * 1000).toLocaleString()}</td>
      <td class="sz">${size(f.size)}</td><td style="width:40px"><a href="/api/downloads/file?name=${encodeURIComponent(f.name)}" download title="Download">⬇</a></td></tr>`).join("");
  pageShell("⬇", "Downloads", "Everything you've exported: brain zips and skill reports. They're also saved in this folder on your PC:", `
    <code class="cp">${esc(d.folder)}</code>
    <div style="margin-top:14px">${rows ? `<table class="files">${rows}</table>` : '<div class="placeholder">Nothing here yet. Use <b>⬇ Download brain (.zip)</b> on a brain, or run a <b>Skill</b>.</div>'}</div>`);
}

checkUpdate();
loadProjects();
refreshFoot(); setInterval(refreshFoot, 60000);
